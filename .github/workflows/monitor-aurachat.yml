name: Vigia externo do Aura Chat

# POR QUE ISTO EXISTE
# Em 22/08/2026 o banco do Aura Chat ficou SOMENTE-LEITURA por 21 minutos: 185
# gravações falharam — webhook de compra, status de mensagem, evento de e-mail,
# disparo — e nada avisou. O registro de erro do próprio app é uma linha no
# mesmo banco, então falhou junto; a tela continuou respondendo 200 porque LER
# continuava funcionando; e este vigia estava verde o tempo todo, porque ele só
# olhava o `sara.energeticseed.com`. A dona só soube porque alguém contou.
#
# POR QUE `/api/health/deep` E NÃO `/api/health`
# O `/health` raso só prova que o Node está atendendo HTTP — teria ficado verde
# nos 21 minutos, igual ao painel. O `/deep` faz uma ESCRITA de verdade numa
# tabela de uma linha e pinga o Redis, e devolve 503 quando qualquer um falha.
# É a única sonda que enxerga banco somente-leitura. O custo é uma escrita
# trivial por checagem (~150/dia numa tabela que existe só pra isso).
#
# POR QUE UM ARQUIVO SEPARADO, E NÃO MAIS UM PASSO NO monitor.yml
# O freio de e-mail conta quantas execuções SEGUIDAS deste workflow falharam, e
# a conta só é exata porque o workflow fica vermelho por UM motivo. Juntando os
# dois apps, uma queda do Aura Chat contaminaria a contagem do Energetic Seed e
# vice-versa — o primeiro e-mail de uma queda nova poderia ser segurado como se
# fosse continuação da outra. É a mesma razão que tirou a conferência de
# certificado do monitor.yml.
#
# INTERVALO: os mesmos 10 minutos do outro vigia, com os minutos DESLOCADOS
# (6, 16, 26...) para os dois não caírem juntos no mesmo instante — e nunca no
# minuto :00, que a documentação do GitHub manda evitar e que faz ele engolir
# execução. O cron de 2 em 2 horas fica como chão de segurança, pelo mesmo
# motivo documentado no monitor.yml: é o único agendamento com confiabilidade
# medida em produção.

on:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
    - cron: '11 */2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vigia-aurachat
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Bater na porta do Aura Chat
        id: check
        run: |
          set -uo pipefail
          OK=0
          MOTIVO=""
          # Três tentativas espaçadas: um soluço de rede não vale um e-mail.
          # Confere o CONTEÚDO, não só o código: durante a troca de containers o
          # Traefik pode entregar a rota da API pro site estático, que responde
          # 200 com HTML. Olhar só o HTTP diria "tudo bem" com a API morta.
          for i in 1 2 3; do
            CORPO=$(curl -s --max-time 20 https://aurachat-api.suportesam.com/api/health/deep || echo "")
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://aurachat-api.suportesam.com/api/health/deep || echo "000")
            case "$CORPO" in *'"ok":true'*) OK=1;; esac
            [ "$OK" = "1" ] && break
            # Guarda o motivo que o próprio app deu: ele diz se quem falhou foi
            # o banco (e se foi na escrita) ou o Redis, e isso vai no e-mail —
            # sem isso o aviso obriga alguém a ir investigar do zero.
            MOTIVO=$(printf '%s' "$CORPO" | head -c 400 | tr -d '\n')
            echo "tentativa $i: HTTP $CODIGO — $MOTIVO"
            sleep 20
          done
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "codigo=${CODIGO:-000}" >> "$GITHUB_OUTPUT"
          {
            echo 'motivo<<FIM'
            echo "${MOTIVO:-sem resposta do app}"
            echo 'FIM'
          } >> "$GITHUB_OUTPUT"
          [ "$OK" = "1" ] && echo "Aura Chat gravando normalmente"
          exit 0

      # O FREIO DE E-MAIL — mesma mecânica do monitor.yml, contando as execuções
      # DESTE arquivo: primeiro tombo avisa na hora, depois no máximo 1 por hora.
      - name: Ver há quanto tempo já está com problema
        id: hist
        if: steps.check.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SEGUIDAS=$(gh api \
            "/repos/${{ github.repository }}/actions/workflows/monitor-aurachat.yml/runs?per_page=30&status=completed" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .conclusion]
                  | (index("success") // length)' 2>/dev/null || echo 0)
          SEGUIDAS=${SEGUIDAS:-0}
          echo "falhas seguidas antes desta: $SEGUIDAS"
          if [ "$SEGUIDAS" -eq 0 ] || [ $(( SEGUIDAS % 6 )) -eq 0 ]; then
            echo "avisar=1" >> "$GITHUB_OUTPUT"
          else
            echo "avisar=0" >> "$GITHUB_OUTPUT"
            echo "já avisei há menos de 1 hora; segurando o e-mail"
          fi
          MIN=$(( (SEGUIDAS + 1) * 10 ))
          echo "ha_quanto=$MIN" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Avisar por e-mail
        if: steps.check.outputs.ok != '1' && steps.hist.outputs.avisar == '1'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CODIGO: ${{ steps.check.outputs.codigo }}
          HA_QUANTO: ${{ steps.hist.outputs.ha_quanto }}
          MOTIVO: ${{ steps.check.outputs.motivo }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY ausente; sem e-mail de aviso"; exit 1
          fi
          jq -n --arg c "$CODIGO" --arg m "$HA_QUANTO" --arg r "$MOTIVO" \
            '{from:"Energetic Seed <deploy@energeticseed.com>",
              to:["ferramentas@auramatrix.com.br"],
              subject:"O Aura Chat não está conseguindo gravar",
              html:("<p>De fora do servidor, o Aura Chat <b>não passou na verificação</b> em 3 tentativas seguidas (última resposta: HTTP " + $c + ").</p>"
                    + "<p>Está assim há pelo menos <b>" + $m + " minutos</b>.</p>"
                    + "<p><b>O que o app respondeu:</b><br><code style=\"font-size:12px\">" + $r + "</code></p>"
                    + "<p>Esta verificação tenta uma <b>gravação de verdade</b> no banco, não só abrir a página. Se ela falha, o painel pode continuar abrindo normalmente enquanto <b>compra, mensagem e opt-out deixam de ser salvos</b> — foi o que aconteceu por 21 minutos em 22/08/2026 sem ninguém perceber.</p>"
                    + "<p style=\"color:#666;font-size:13px\">Verificação automática de 10 em 10 minutos. Enquanto continuar com problema você recebe no máximo <b>um aviso por hora</b>.</p>")}' \
            > /tmp/email-aurachat.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/email-aurachat.json
          echo "aviso enviado"

      # Vermelho alimenta o freio na próxima execução — ver monitor.yml.
      - name: Marcar a execução como falha
        if: steps.check.outputs.ok != '1'
        run: |
          echo "Aura Chat com problema; execução marcada como falha (é o que alimenta o freio)"
          exit 1
