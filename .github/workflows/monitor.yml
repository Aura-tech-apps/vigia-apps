name: Vigia externo do app

# POR QUE ISTO EXISTE
# O vigia que roda DENTRO da VPS (deploy/vps-watchdog.sh) avisa quando o app cai
# com o servidor de pé, que é o caso mais comum. Mas se a VPS inteira morrer, ele
# morre junto e ninguém é avisado: foi assim que o app ficou 2 dias fora do ar em
# julho de 2026 sem ninguém perceber.
#
# Este aqui roda na infraestrutura do GitHub, ou seja, de fora. É o único olho
# que continua aberto quando o servidor todo apaga.
#
# POR QUE ESTE REPOSITÓRIO É PÚBLICO. Repositório público tem minutos de Actions
# ILIMITADOS; privado tem 2000/mês. Em 21/08/2026 a organização estourou a cota e
# este vigia MORREU junto com todo o resto — exatamente o cenário que ele existe
# pra cobrir. Aqui ele nunca mais fica sem saldo.
# Nada sensível mora neste arquivo: ele só consulta endereços que já são públicos.
# O endereço direto da VPS vive no segredo VPS_ORIGEM porque publicá-lo entregaria
# o servidor de origem que a Cloudflare existe pra esconder.
#
# CUSTO HISTÓRICO (mantido pra explicar o intervalo de 2h): o GitHub cobra o mínimo
# de 1 minuto por execução, e o plano gratuito de repositório privado dá 2000 por mês. De hora em hora dava ~720
# execuções mensais, e em 06/08/2026 o saldo acabou: as execuções ficaram
# PRESAS NA FILA sem nunca começar, o CI parou e este vigia foi morto esperando,
# o que ainda pintou de vermelho um dia em que o app estava perfeitamente de pé.
# Ficar sem vigia é o pior dos mundos: se a VPS inteira apagar, ninguém avisa.
# De 2 em 2 horas custa metade (~360 por mês) e a demora máxima pra descobrir
# uma queda passa de 1 para 2 horas, o que é troca justa por ter o olho aberto.

on:
  schedule:
    - cron: '7 */2 * * *' # de 2 em 2 horas. O minuto 7 evita o pico do :00.
  workflow_dispatch: # permite rodar na mão pra testar

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Bater na porta do app
        id: check
        run: |
          set -uo pipefail
          OK=0
          # Três tentativas espaçadas: um soluço de rede não vale um e-mail.
          # Confere o CONTEÚDO: durante a troca de containers o Traefik entrega
          # o /api/health pro site estático, que responde 200 com HTML. Olhar só
          # o código HTTP diria "tudo bem" com a API morta.
          for i in 1 2 3; do
            CORPO=$(curl -s --max-time 15 https://sara.energeticseed.com/api/health || echo "")
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              https://sara.energeticseed.com/api/health || echo "000")
            case "$CORPO" in *'"ok":true'*) OK=1;; esac
            [ "$OK" = "1" ] && break
            echo "tentativa $i: HTTP $CODIGO, corpo não é o do health"
            sleep 20
          done
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "codigo=${CODIGO:-000}" >> "$GITHUB_OUTPUT"
          [ "$OK" = "1" ] && echo "app respondendo normalmente"
          exit 0

      # CONFERÊNCIA DO CERTIFICADO, UMA VEZ POR DIA.
      #
      # Pega carona numa execução que já ia acontecer de qualquer jeito, então
      # não gasta minuto nenhum a mais do saldo do GitHub, que já acabou uma vez
      # (ver o comentário lá em cima).
      #
      # POR QUE OLHAR A VPS DIRETO, E NÃO O ENDEREÇO DO SITE. Desde 10/08/2026 a
      # Cloudflare atende na frente. Quem pergunta o certificado de
      # `sara.energeticseed.com` recebe o DELA, que ela renova sozinha e não é
      # problema nosso. O nosso é o Let's Encrypt que vive na VPS, e ele só
      # aparece perguntando direto ao endereço da máquina. Vigiar o endereço
      # público daria "tudo certo" para sempre, inclusive no dia em que o nosso
      # vencesse.
      #
      # E POR QUE O NOSSO AINDA IMPORTA. Com a Cloudflare em Full (strict), ela
      # confere o nosso certificado antes de falar com a VPS. Se ele vencer, ela
      # recusa e o site sai do ar inteiro, mesmo com o servidor perfeito.
      #
      # O Traefik renova sozinho faltando 30 dias. Abaixo de 21 significa que a
      # renovação já falhou por mais de uma semana em silêncio, que é exatamente
      # o tipo de defeito que este vigia existe pra pegar.
      - name: Conferir o certificado e o caminho da renovação
        id: cert
        # Só quando o app respondeu: se a VPS inteira caiu, o e-mail que importa
        # é o outro, e este viraria barulho em cima de quem já está apagando
        # incêndio. A escolha do dia e da hora fica no script, logo abaixo.
        if: steps.check.outputs.ok == '1'
        env:
          HOST: sara.energeticseed.com
          # Endereço da VPS. Se um dia a máquina mudar de endereço, esta
          # conferência passa a falhar e manda e-mail, que é o jeito certo de
          # errar: barulho é melhor que um vigia calado olhando pro nada.
          ORIGEM: ${{ secrets.VPS_ORIGEM }}
        run: |
          set -uo pipefail
          if [ -z "${ORIGEM:-}" ]; then
            echo "AVISO: segredo VPS_ORIGEM não configurado; conferência do certificado pulada"
            echo "alerta=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Só uma vez por dia, de manhã em Nova York, onde o app vive.
          #
          # A janela é de DUAS horas de propósito. O gatilho roda em horas pares,
          # então só a execução das 12h cai aqui dentro, e ela não repete. Mas o
          # GitHub atrasa execução agendada quando está cheio, e com uma janela de
          # uma hora só um atraso de 20 minutos faria a conferência ser pulada
          # calada, que é o pior jeito de um vigia falhar.
          HORA=$(date -u +%H)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$HORA" != "12" ] && [ "$HORA" != "13" ]; then
            echo "agora são ${HORA}h UTC, fora da janela da conferência diária; pulando"
            echo "alerta=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          PROBLEMAS=""

          # 1) Quantos dias faltam pro NOSSO certificado, o da VPS.
          DIAS=""
          for i in 1 2; do
            FIM=$(echo | openssl s_client -connect "$ORIGEM:443" -servername "$HOST" 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -n "$FIM" ]; then
              FIM_S=$(date -u -d "$FIM" +%s 2>/dev/null || echo "")
              if [ -n "$FIM_S" ]; then
                DIAS=$(( (FIM_S - $(date -u +%s)) / 86400 ))
                break
              fi
            fi
            echo "tentativa $i: não consegui ler o certificado da VPS"; sleep 10
          done

          if [ -z "$DIAS" ]; then
            PROBLEMAS="$PROBLEMAS<li>Não consegui <b>ler o certificado direto na VPS</b> ($ORIGEM) em 2 tentativas. Ou a máquina mudou de endereço, ou parou de atender.</li>"
          else
            echo "certificado da VPS vence em $DIAS dias"
            if [ "$DIAS" -lt 21 ]; then
              PROBLEMAS="$PROBLEMAS<li>O certificado da VPS vence em <b>$DIAS dias</b>. Ele deveria ter se renovado sozinho faltando 30, então a renovação está falhando há mais de uma semana. Quando vencer, a Cloudflare recusa a VPS e <b>o site sai do ar inteiro</b>.</li>"
            fi
          fi

          # 2) O caminho que a renovação usa continua aberto? Se a Cloudflare
          # passar a barrar este endereço, a renovação quebra em silêncio semanas
          # antes de o certificado vencer, e ninguém descobre até o site cair.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "http://$HOST/.well-known/acme-challenge/vigia-$(date -u +%s)" || echo "000")
          echo "caminho da renovação respondeu HTTP $CODIGO"
          # 404 é o esperado (o desafio não existe, mas chegou no nosso servidor).
          # Redirecionamento também serve: o Let's Encrypt segue. 403 é a
          # Cloudflare barrando, e 5xx/000 é o caminho quebrado.
          case "$CODIGO" in
            404|200|301|302|308) : ;;
            *) PROBLEMAS="$PROBLEMAS<li>O <b>caminho da renovação</b> respondeu HTTP $CODIGO (o esperado é 404). Se ele estiver bloqueado, o certificado não se renova e o site cai quando ele vencer.</li>" ;;
          esac

          if [ -n "$PROBLEMAS" ]; then
            echo "alerta=<ul>$PROBLEMAS</ul>" >> "$GITHUB_OUTPUT"
          else
            echo "alerta=" >> "$GITHUB_OUTPUT"
            echo "certificado e renovação em ordem"
          fi
          exit 0

      - name: Avisar por e-mail se o certificado estiver em risco
        if: steps.cert.outputs.alerta != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA: ${{ steps.cert.outputs.alerta }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY ausente; sem e-mail de aviso"; exit 1
          fi
          jq -n --arg a "$ALERTA" \
            '{from:"Energetic Seed <deploy@energeticseed.com>",
              to:["ferramentas@auramatrix.com.br"],
              subject:"Certificado do app Energetic Seed precisa de atenção",
              html:("<p>O app está no ar normalmente, isto é um aviso <b>com antecedência</b>:</p>"
                    + $a
                    + "<p>O que fazer: entrar na VPS e olhar o Traefik, que é quem renova. "
                    + "O comando que mostra o motivo é <code>docker logs $(docker ps --filter name=traefik -q) 2>&amp;1 | grep -i acme</code>.</p>"
                    + "<p style=\"color:#666;font-size:13px\">Conferência automática, uma vez por dia. Ela olha o certificado direto na VPS, e não pelo endereço do site, porque pelo site quem responde é a Cloudflare.</p>")}' \
            > /tmp/email-cert.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/email-cert.json
          echo "aviso de certificado enviado"
          exit 1

      - name: Avisar por e-mail se não respondeu
        if: steps.check.outputs.ok != '1'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CODIGO: ${{ steps.check.outputs.codigo }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY ausente; sem e-mail de aviso"; exit 1
          fi
          jq -n --arg c "$CODIGO" \
            '{from:"Energetic Seed <deploy@energeticseed.com>",
              to:["ferramentas@auramatrix.com.br"],
              subject:"O app Energetic Seed não está respondendo",
              html:("<p>De fora do servidor, o app <b>não respondeu</b> em 3 tentativas seguidas (última resposta: HTTP " + $c + ").</p>"
                    + "<p>Como esta checagem roda no GitHub e não na VPS, isto costuma significar que o <b>servidor inteiro</b> está fora do ar, e não só o app.</p>"
                    + "<p style=\"color:#666;font-size:13px\">Verificação automática, de hora em hora.</p>")}' \
            > /tmp/email.json
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" -d @/tmp/email.json
          echo "aviso enviado"
          exit 1
